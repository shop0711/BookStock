<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2a251e" />
      <stop offset="100%" stop-color="#0d0c0a" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cca566" />
      <stop offset="50%" stop-color="#eedc9a" />
      <stop offset="100%" stop-color="#a8803e" />
    </linearGradient>
  </defs>
  
  <!-- シャドウとベースの暗いカプセル型（Secretカード） -->
  <rect width="200" height="400" rx="100" fill="url(#bgGrad)" opacity="0.95" />
  
  <!-- 内側のエレガントなゴールド点線フレーム -->
  <rect x="10" y="10" width="180" height="380" rx="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.4" stroke-dasharray="6 8"/>
  
  <!-- 大きな「？」マーク -->
  <text x="100" y="240" font-family="'Cormorant Garamond', 'Times New Roman', serif" font-size="160" fill="url(#goldGrad)" text-anchor="middle" opacity="0.5" font-style="italic">?</text>
  
  <!-- SECRETの文字 -->
  <text x="102" y="340" font-family="'Noto Sans JP', sans-serif" font-size="12" fill="url(#goldGrad)" letter-spacing="8" text-anchor="middle" font-weight="300" opacity="0.7">SECRET</text>

  <!-- 装飾用の光の粒 -->
  <circle cx="140" cy="100" r="2.5" fill="#eedc9a" opacity="0.8" />
  <polygon points="140,95 142,100 147,100 142,102 143,107 140,103 137,107 138,102 133,100 138,100" fill="#eedc9a" opacity="0.6"/>
  
  <circle cx="60" cy="280" r="1.5" fill="#cca566" opacity="0.6" />
</svg>
